[project]
name = "haven"
version = "0.1.0"
description = "Haven API"
requires-python = ">=3.12"
dependencies = [
    "apsw>=3.54.1.0,<4",
    "argon2-cffi>=23.1,<26",
    "litestar[standard]>=2.0,<3",
    "msgspec>=0.18,<1",
    "ortools>=9.15,<10",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.12"
