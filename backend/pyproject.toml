[project]
name = "haven"
version = "0.1.0"
description = "Haven API"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.0,<3",
    "msgspec>=0.18,<1",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
